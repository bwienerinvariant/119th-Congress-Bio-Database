<html lang="en">
<head>
<meta charset="UTF-8">

<title>Congressional Directory · Invariant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --navy: #0E1B33;
  --navy-soft: #16274A;
  --red: #B3202D;
  --red-soft: #F5DEDF;
  --page-bg: #EEF0F3;
  --card: #FFFFFF;
  --card-alt: #F5F6F8;
  --ink: #1A1F29;
  --slate: #6B7280;
  --rule: #E2E4E9;

  --dem: #1D4ED8;
  --dem-bg: #E1E9FB;
  --rep: #B3202D;
  --rep-bg: #F5DEDF;
  --ind: #6B7280;
  --ind-bg: #E9EAEC;

  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }

.masthead { background: var(--navy); color: #fff; }
.masthead-inner { max-width: 1120px; margin: 0 auto; padding: 20px 28px 16px; }
.masthead-inner h1 { font-size: 19px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
.masthead-updated { margin: 0; font-size: 12px; font-family: var(--mono); color: #9AA3B8; letter-spacing: 0.02em; }
.brand-rule { height: 4px; background: var(--red); }

.tabs { background: var(--navy-soft); position: sticky; top: 0; z-index: 10; }
.tabs-inner { max-width: 1120px; margin: 0 auto; padding: 0 28px; display: flex; gap: 6px; overflow-x: auto; }
.tab-btn {
  appearance: none; background: none; border: none; border-bottom: 3px solid transparent;
  padding: 15px 16px; font-family: var(--sans); font-size: 13.5px; font-weight: 600;
  color: #A9B2C6; cursor: pointer; white-space: nowrap;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.tab-btn:hover { color: #fff; }
.tab-btn.is-active { color: #fff; border-bottom-color: var(--red); }
.tab-count { font-family: var(--mono); font-size: 11.5px; font-weight: 500; margin-left: 6px; color: #7A85A0; }
.tab-btn.is-active .tab-count { color: #C5CDDF; }

.content { max-width: 1120px; margin: 0 auto; padding: 32px 28px 80px; }

.search-bar {
  background: var(--card); border: 1px solid var(--rule); border-top: 3px solid var(--red);
  padding: 18px 22px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(14, 27, 51, 0.04);
}

.search-input-wrap { position: relative; margin-bottom: 14px; }
.search-input {
  width: 100%; padding: 12px 16px 12px 44px; font-family: var(--sans); font-size: 15px;
  background: var(--card-alt); border: 1px solid var(--rule); border-radius: 4px; color: var(--ink);
  transition: border-color 0.15s, background 0.15s;
}
.search-input:focus { outline: none; border-color: var(--navy); background: var(--card); }
.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--slate); pointer-events: none;
}

.filter-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end;
}
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-label {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--slate); font-weight: 600;
}
.filter-select {
  appearance: none; padding: 9px 32px 9px 12px; font-family: var(--sans); font-size: 13.5px;
  background: var(--card-alt); border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1L6 6L11 1' stroke='%236B7280' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center;
}
.filter-select:focus { outline: none; border-color: var(--navy); background-color: var(--card); }
.filter-clear-btn {
  appearance: none; background: none; border: 1px solid var(--rule); border-radius: 4px;
  padding: 9px 14px; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--slate);
  cursor: pointer; transition: color 0.15s, border-color 0.15s;
}
.filter-clear-btn:hover { color: var(--red); border-color: var(--red); }

.pg-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--card-alt);
  border: 1px solid var(--rule);
  border-radius: 4px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--slate);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  user-select: none;
}
.pg-toggle input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.pg-toggle-track {
  position: relative;
  width: 30px;
  height: 16px;
  background: #CFD3DA;
  border-radius: 999px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.pg-toggle-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.15s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.pg-toggle input:checked + .pg-toggle-track {
  background: var(--red);
}
.pg-toggle input:checked + .pg-toggle-track::after {
  transform: translateX(14px);
}
.pg-toggle:has(input:not(:disabled)):hover {
  border-color: var(--red);
  color: var(--red);
}
.pg-toggle:has(input:disabled) {
  opacity: 0.45;
  cursor: not-allowed;
}
.pg-toggle:has(input:checked) {
  color: var(--red);
  border-color: var(--red);
  background: var(--card);
}

.results-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 12px; padding: 0 4px;
}
.results-count {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--slate); font-weight: 600;
}
.results-count strong { color: var(--navy); font-weight: 700; }
.pg-hint {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--red); font-weight: 600;
}

.member-list { display: flex; flex-direction: column; gap: 8px; }

.group-section {
  margin-bottom: 12px;
}
.group-section:last-child { margin-bottom: 0; }

.group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  padding: 12px 16px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--card);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.005em;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}
.group-header:hover { border-color: #CBD5E1; }
.group-header:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }

.group-marker {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--red);
  border-radius: 50%;
  flex-shrink: 0;
}

.group-title {
  flex: 1;
  min-width: 0;
}

.group-count {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--slate);
  font-weight: 500;
  text-transform: uppercase;
  white-space: nowrap;
}

.group-chevron {
  color: var(--slate);
  flex-shrink: 0;
  transition: transform 0.2s ease;
}

.group-section.is-open .group-chevron { transform: rotate(180deg); }
.group-section.is-open .group-header {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}
.group-section.is-open .group-header .group-count { color: #C5CDDF; }
.group-section.is-open .group-header .group-chevron { color: #C5CDDF; }

.group-members {
  display: none;
  padding: 10px 12px;
  background: var(--card-alt);
  border: 1px solid var(--rule);
  border-top: none;
  border-bottom-left-radius: 6px;
  border-bottom-right-radius: 6px;
  gap: 6px;
  flex-direction: column;
}
.group-section.is-open .group-members { display: flex; }

.group-toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
  padding: 0 4px;
}
.group-toolbar-btn {
  appearance: none;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 6px 12px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  color: var(--slate);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.group-toolbar-btn:hover { color: var(--red); border-color: var(--red); }

.member-card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
  box-shadow: 0 1px 2px rgba(14, 27, 51, 0.04); overflow: hidden;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.member-card:hover { border-color: #CBD5E1; }
.member-card.is-open { box-shadow: 0 4px 12px rgba(14, 27, 51, 0.08); }

.member-summary {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: center;
  padding: 14px 20px; cursor: pointer; border: none; background: none; width: 100%;
  text-align: left; font-family: inherit;
}
.member-summary:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }

.party-mark {
  width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: -0.02em;
}
.party-D { background: var(--dem-bg); color: var(--dem); }
.party-R { background: var(--rep-bg); color: var(--rep); }
.party-I { background: var(--ind-bg); color: var(--ind); }

.member-name { font-size: 15.5px; font-weight: 700; color: var(--navy); margin: 0; }
.member-title {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.03em; color: var(--slate); margin-top: 2px;
}
.member-chevron { color: var(--slate); transition: transform 0.2s ease; flex-shrink: 0; }
.member-card.is-open .member-chevron { transform: rotate(180deg); }

.member-body {
  display: none; padding: 4px 20px 20px; border-top: 1px solid var(--rule); margin-top: 4px;
}
.member-card.is-open .member-body { display: block; }

.bio-header {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--red); font-weight: 600; margin: 18px 0 10px;
}
.bio-text {
  font-size: 14.5px; line-height: 1.65; color: var(--ink); margin: 0;
}
.bio-text strong { color: var(--navy); font-weight: 700; }
.bio-text + .bio-text { margin-top: 12px; }

.bio-actions {
  display: flex; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule);
}
.copy-btn {
  appearance: none; background: var(--navy); color: #fff; border: none; border-radius: 4px;
  padding: 9px 16px; font-family: var(--sans); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
  display: inline-flex; align-items: center; gap: 8px;
}
.copy-btn:hover { background: #1B2E52; }
.copy-btn.copied { background: #1E6B3A; }
.copy-btn.copied .copy-btn-label::before { content: "✓ "; }

.empty-state {
  padding: 60px 20px; text-align: center; color: var(--slate); font-size: 14px;
  background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
}
.empty-state strong { color: var(--navy); display: block; font-size: 15px; margin-bottom: 6px; font-weight: 700; }

.foot {
  max-width: 1120px; margin: 40px auto 0; padding: 24px 28px 40px;
  border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.04em;
  color: var(--slate); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
.foot strong { color: var(--navy); }

@media (max-width: 640px) {
  .content { padding: 20px 16px 60px; }
  .masthead-inner { padding: 16px 20px 12px; }
  .tabs-inner { padding: 0 16px; }
  .search-bar { padding: 14px 16px; }
  .member-summary { padding: 12px 14px; grid-template-columns: 32px 1fr auto; gap: 12px; }
  .member-body { padding: 4px 14px 16px; }
  .filter-row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function memberChamber(m) {
  if (m.ch === 'S') return 'S';
  if (m.t === 'Del' || m.t === 'Resident Commissioner') return 'H-D';
  return 'H-R';
}

function formatLoc(m) {
  const stateName = STATE_NAMES[m.s] || m.s;
  if (m.ch === 'S') return `Sen. · ${stateName}`;
  if (m.t === 'Del') return `Del. · ${stateName}`;
  if (m.t === 'Resident Commissioner') return `Resident Commissioner · ${stateName}`;
  if (m.d === 'At-Large' || !m.d) return `Rep. · ${stateName} at-large`;
  return `Rep. · ${stateName}-${m.d}`;
}

// ---- COMMITTEE RENDERING ----

const HIDDEN_COMMITTEES = new Set([
  'Joint Committee on Printing',
  'Joint Committee on the Library of Congress',
]);

// Mega-committees: when tagged for a PG, only show individually-tagged subs.
// (All other tagged committees show ALL their subs.)
const MEGA_COMMITTEES = new Set([
  'Appropriations Committee',
]);

function subsToShow(committee, pg) {
  if (!pg) return committee.subs;
  if (!committee.tags.includes(pg)) return [];  // parent not tagged: no subs
  if (MEGA_COMMITTEES.has(committee.display)) {
    // Mega: only individually-tagged subs
    return committee.subs.filter(s => s.tags.includes(pg));
  }
  return committee.subs;  // regular tagged committee: all subs
}

function renderDetailedSentence(committee, subs, isFirst, pronoun, pronounCap) {
  const display = committee.display;
  const role = committee.role;
  
  let opening;
  if (role === 'Chairman' || role === 'Chairwoman') {
    opening = isFirst ? `${pronounCap} chairs the ${display}` : `${pronounCap} also chairs the ${display}`;
  } else if (role === 'Ranking Member') {
    opening = isFirst ? `${pronounCap} is Ranking Member of the ${display}` : `${pronounCap} is also Ranking Member of the ${display}`;
  } else if (role === 'Vice Chair') {
    opening = isFirst ? `${pronounCap} is Vice Chair of the ${display}` : `${pronounCap} is also Vice Chair of the ${display}`;
  } else {
    opening = isFirst ? `${pronounCap} sits on the ${display}` : `${pronounCap} also sits on the ${display}`;
  }
  
  if (!subs.length) return opening + '.';
  
  const chairSubs = subs.filter(s => s.role === 'Chairman' || s.role === 'Chairwoman');
  const rmSubs = subs.filter(s => s.role === 'Ranking Member');
  const vcSubs = subs.filter(s => s.role === 'Vice Chair');
  const noRoleSubs = subs.filter(s => !s.role);
  
  const parts = [];
  for (const s of chairSubs) {
    const title = pronoun === 'she' ? 'Chairwoman' : 'Chairman';
    parts.push(`is ${title} of the ${s.name} Subcommittee`);
  }
  for (const s of rmSubs) parts.push(`is Ranking Member of the ${s.name} Subcommittee`);
  for (const s of vcSubs) parts.push(`is Vice Chair of the ${s.name} Subcommittee`);
  
  if (noRoleSubs.length) {
    const names = noRoleSubs.map(s => s.name);
    const hasCommas = names.some(n => n.includes(','));
    let phrase;
    if (names.length === 1) {
      phrase = `serves on the ${names[0]} Subcommittee`;
    } else if (names.length === 2) {
      if (hasCommas) phrase = `serves on the ${names[0]}; and ${names[1]} Subcommittees`;
      else phrase = `serves on the ${names[0]} and ${names[1]} Subcommittees`;
    } else {
      let joined;
      if (hasCommas) joined = names.slice(0,-1).join('; ') + '; and ' + names[names.length-1];
      else joined = names.slice(0,-1).join(', ') + ', and ' + names[names.length-1];
      phrase = `serves on the ${joined} Subcommittees`;
    }
    if (parts.length) parts.push(`also ${phrase}`);
    else parts.push(phrase);
  }
  
  if (parts.length === 1) return `${opening}, where ${pronoun} ${parts[0]}.`;
  return `${opening}, where ${pronoun} ` + parts.join(' and ') + '.';
}

function renderBareSentence(committees, isFirst, pronounCap) {
  const displays = committees.map(c => c.display);
  const verb = isFirst ? 'sits on' : 'also sits on';
  if (displays.length === 1) return `${pronounCap} ${verb} the ${displays[0]}.`;
  if (displays.length === 2) return `${pronounCap} ${verb} the ${displays[0]} and the ${displays[1]}.`;
  return `${pronounCap} ${verb} the ` + displays.slice(0,-1).join('; ') + `; and ${displays[displays.length-1]}.`;
}

function renderCommittees(committees, pronoun, pronounCap, pg) {
  if (!committees || !committees.length) return '';
  
  // Filter out hidden ceremonial committees
  committees = committees.filter(c => !HIDDEN_COMMITTEES.has(c.display));
  if (!committees.length) return '';
  
  const roleCmtes = [];
  const detailedCmtes = [];
  const bareCmtes = [];
  
  for (const c of committees) {
    const subs = subsToShow(c, pg);
    const hasRole = ['Chairman','Chairwoman','Ranking Member','Vice Chair'].includes(c.role);
    if (hasRole) roleCmtes.push([c, subs]);
    else if (subs.length) detailedCmtes.push([c, subs]);
    else bareCmtes.push(c);
  }
  
  const sentences = [];
  let isFirst = true;
  
  for (const [c, subs] of roleCmtes) {
    sentences.push(renderDetailedSentence(c, subs, isFirst, pronoun, pronounCap));
    isFirst = false;
  }
  for (const [c, subs] of detailedCmtes) {
    sentences.push(renderDetailedSentence(c, subs, isFirst, pronoun, pronounCap));
    isFirst = false;
  }
  if (bareCmtes.length) sentences.push(renderBareSentence(bareCmtes, isFirst, pronounCap));
  
  return sentences.join(' ');
}

function buildBio(m, pg) {
  const cmteText = renderCommittees(m.cm, m.pr, m.prC, pg);
  const parts = [m.op];
  if (cmteText) parts.push(cmteText);
  if (m.pt) parts.push(m.pt);
  return parts.filter(p => p).join(' ');
}

function memberInPG(member, pg) {
  if (!pg) return true;
  for (const c of member.cm) {
    if (HIDDEN_COMMITTEES.has(c.display)) continue;
    // For non-mega committees, parent tag counts
    if (!MEGA_COMMITTEES.has(c.display) && c.tags.includes(pg)) return true;
    // For any committee (including mega), individually-tagged subs count
    for (const s of c.subs) {
      if (s.tags.includes(pg)) return true;
    }
  }
  return false;
}

// ---- STATE ----

let currentChamber = 'ALL';
let searchQuery = '';
let partyFilter = '';
let stateFilter = '';
let pgFilter = '';
let pgFilterMembers = false;
const openCards = new Set();
const openGroups = new Set();

function getFilteredMembers() {
  let members = DATA.members.slice();
  if (currentChamber !== 'ALL') {
    members = members.filter(m => memberChamber(m) === currentChamber);
  }
  if (partyFilter) {
    members = members.filter(m => m.p === partyFilter);
  }
  if (stateFilter) {
    members = members.filter(m => m.s === stateFilter);
  }
  if (pgFilter && pgFilterMembers) {
    members = members.filter(m => memberInPG(m, pgFilter));
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase().trim();
    const districtMatch = q.match(/^([a-z]{2})[- ]?(\d+)?$/i);
    if (districtMatch) {
      const st = districtMatch[1].toUpperCase();
      const d = districtMatch[2];
      members = members.filter(m => {
        if (m.s !== st) return false;
        if (d) return m.d === d || m.d === d.padStart(2, '0');
        return true;
      });
    } else {
      members = members.filter(m => {
        const stateName = STATE_NAMES[m.s] || m.s;
        return m.n.toLowerCase().includes(q) ||
               stateName.toLowerCase().includes(q) ||
               m.s.toLowerCase() === q;
      });
    }
  }
  members.sort((a, b) => {
    const lnA = a.n.split(' ').slice(-1)[0].toLowerCase();
    const lnB = b.n.split(' ').slice(-1)[0].toLowerCase();
    return lnA.localeCompare(lnB);
  });
  return members;
}

function renderMember(m) {
  const bio = buildBio(m, pgFilter);
  return `
    <article class="member-card" data-key="${escapeHtml(m.n)}">
      <button type="button" class="member-summary" aria-expanded="false">
        <div class="party-mark party-${m.p}">${m.p}</div>
        <div>
          <div class="member-name">${escapeHtml(m.n)}</div>
          <div class="member-title">${escapeHtml(formatLoc(m))}</div>
        </div>
        <svg class="member-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="member-body">
        <div class="bio-header">Bio</div>
        <p class="bio-text"><strong>${escapeHtml(m.h)}</strong></p>
        <p class="bio-text">${escapeHtml(bio)}</p>
      </div>
    </article>
  `;
}

function getGroupsForPG(pg, filteredMembers) {
  const groups = new Map();
  for (const m of filteredMembers) {
    const chamberPrefix = m.ch === 'S' ? 'Senate ' : 'House ';
    for (const c of m.cm) {
      if (HIDDEN_COMMITTEES.has(c.display)) continue;
      if (!MEGA_COMMITTEES.has(c.display) && c.tags.includes(pg)) {
        if (!groups.has(c.display)) groups.set(c.display, { label: c.display, members: [], sortKey: 0 });
        groups.get(c.display).members.push(m);
      }
      if (MEGA_COMMITTEES.has(c.display)) {
        for (const s of c.subs) {
          if (s.tags.includes(pg)) {
            const key = chamberPrefix + c.display + '::' + s.name;
            const label = chamberPrefix + c.display.replace(' Committee', '') + ': ' + s.name + ' Subcommittee';
            if (!groups.has(key)) groups.set(key, { label, members: [], sortKey: 2 });
            groups.get(key).members.push(m);
          }
        }
      }
    }
  }
  // Sort groups: full committees before mega-sub groups; Senate before House within committees
  const arr = Array.from(groups.values());
  arr.forEach(g => {
    if (g.sortKey === 0) {
      // committees
      if (g.label.includes('Senate ') || g.label.match(/^(Health, Education|Banking|Environment and Public Works|Foreign Relations|Finance|Commerce, Science|Homeland Security and Governmental|Judiciary|Rules and Administration|Agriculture, Nutrition|Armed Services|Budget|Appropriations|Veterans|Small Business and Entrepreneurship|Energy and Natural)/)) {
        g.sortKey = 0;  // Senate
      } else {
        g.sortKey = 1;  // House
      }
    }
  });
  arr.sort((a, b) => {
    if (a.sortKey !== b.sortKey) return a.sortKey - b.sortKey;
    return a.label.localeCompare(b.label);
  });
  return arr;
}

function sortMembersInGroup(members, pg, groupLabel) {
  // Chair first, then RM, then VC, then alphabetical
  const rank = m => {
    for (const c of m.cm) {
      if (c.display === groupLabel.split(':')[0].trim() + ' Committee' || c.display === groupLabel) {
        if (c.role === 'Chairman' || c.role === 'Chairwoman') return 0;
        if (c.role === 'Ranking Member') return 1;
        if (c.role === 'Vice Chair') return 2;
      }
    }
    return 3;
  };
  return members.slice().sort((a, b) => {
    const ra = rank(a), rb = rank(b);
    if (ra !== rb) return ra - rb;
    const lnA = a.n.split(' ').slice(-1)[0].toLowerCase();
    const lnB = b.n.split(' ').slice(-1)[0].toLowerCase();
    return lnA.localeCompare(lnB);
  });
}

function render() {
  const members = getFilteredMembers();
  const list = document.getElementById('member-list');
  const empty = document.getElementById('empty-state');
  document.getElementById('result-count').textContent = members.length;
  if (members.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    // Grouped display when PG filter members is on
    if (pgFilter && pgFilterMembers) {
      const groups = getGroupsForPG(pgFilter, members);
      const toolbar = `
        <div class="group-toolbar">
          <button type="button" class="group-toolbar-btn" data-groups-expand>Expand all</button>
          <button type="button" class="group-toolbar-btn" data-groups-collapse>Collapse all</button>
        </div>
      `;
      list.innerHTML = toolbar + groups.map((g, i) => `
        <section class="group-section" data-group-key="${escapeHtml(g.label)}">
          <button type="button" class="group-header" aria-expanded="false">
            <span class="group-marker"></span>
            <span class="group-title">${escapeHtml(g.label)}</span>
            <span class="group-count">${g.members.length} member${g.members.length === 1 ? '' : 's'}</span>
            <svg class="group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="group-members">
            ${sortMembersInGroup(g.members, pgFilter, g.label).map(renderMember).join('')}
          </div>
        </section>
      `).join('');
      // Restore open state for groups (if user had them open)
      list.querySelectorAll('.group-section').forEach(section => {
        if (openGroups.has(section.dataset.groupKey)) {
          section.classList.add('is-open');
          section.querySelector('.group-header').setAttribute('aria-expanded', 'true');
        }
      });
    } else {
      list.innerHTML = members.map(renderMember).join('');
    }
    list.querySelectorAll('.member-card').forEach(card => {
      if (openCards.has(card.dataset.key)) {
        card.classList.add('is-open');
        card.querySelector('.member-summary').setAttribute('aria-expanded', 'true');
      }
    });
  }
  document.getElementById('pg-hint').textContent = pgFilter 
    ? (pgFilterMembers ? `Members on ${pgFilter}` : `Subcommittees · ${pgFilter}`) 
    : '';
}

function updateTabCounts() {
  let base = DATA.members.slice();
  if (partyFilter) base = base.filter(m => m.p === partyFilter);
  if (stateFilter) base = base.filter(m => m.s === stateFilter);
  if (pgFilter && pgFilterMembers) base = base.filter(m => memberInPG(m, pgFilter));
  if (searchQuery) {
    const q = searchQuery.toLowerCase().trim();
    const dm = q.match(/^([a-z]{2})[- ]?(\d+)?$/i);
    if (dm) {
      const st = dm[1].toUpperCase();
      const d = dm[2];
      base = base.filter(m => {
        if (m.s !== st) return false;
        if (d) return m.d === d || m.d === d.padStart(2, '0');
        return true;
      });
    } else {
      base = base.filter(m => {
        const stateName = STATE_NAMES[m.s] || m.s;
        return m.n.toLowerCase().includes(q) ||
               stateName.toLowerCase().includes(q) ||
               m.s.toLowerCase() === q;
      });
    }
  }
  document.getElementById('count-all').textContent = base.length;
  document.getElementById('count-s').textContent = base.filter(m => memberChamber(m) === 'S').length;
  document.getElementById('count-h').textContent = base.filter(m => memberChamber(m) === 'H-R').length;
  document.getElementById('count-d').textContent = base.filter(m => memberChamber(m) === 'H-D').length;
}

// ---- EVENTS ----

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('is-active'));
  btn.classList.add('is-active');
  currentChamber = btn.dataset.chamber;
  render();
});

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { updateTabCounts(); render(); }, 100);
});
document.getElementById('party-filter').addEventListener('change', e => {
  partyFilter = e.target.value; updateTabCounts(); render();
});
document.getElementById('state-filter').addEventListener('change', e => {
  stateFilter = e.target.value; updateTabCounts(); render();
});
document.getElementById('pg-filter').addEventListener('change', e => {
  pgFilter = e.target.value;
  const toggle = document.getElementById('pg-filter-toggle');
  if (!pgFilter) {
    toggle.checked = false;
    toggle.disabled = true;
    pgFilterMembers = false;
  } else {
    toggle.disabled = false;
  }
  updateTabCounts();
  render();
});
document.getElementById('pg-filter-toggle').addEventListener('change', e => {
  pgFilterMembers = e.target.checked;
  updateTabCounts();
  render();
});
document.getElementById('clear-filters').addEventListener('click', () => {
  searchQuery = ''; partyFilter = ''; stateFilter = ''; pgFilter = ''; pgFilterMembers = false;
  document.getElementById('search').value = '';
  document.getElementById('party-filter').value = '';
  document.getElementById('state-filter').value = '';
  document.getElementById('pg-filter').value = '';
  const toggle = document.getElementById('pg-filter-toggle');
  toggle.checked = false;
  toggle.disabled = true;
  updateTabCounts(); render();
});

document.getElementById('member-list').addEventListener('click', e => {
  // Expand/collapse all groups
  if (e.target.closest('[data-groups-expand]')) {
    document.querySelectorAll('.group-section').forEach(section => {
      section.classList.add('is-open');
      section.querySelector('.group-header').setAttribute('aria-expanded', 'true');
      openGroups.add(section.dataset.groupKey);
    });
    return;
  }
  if (e.target.closest('[data-groups-collapse]')) {
    document.querySelectorAll('.group-section').forEach(section => {
      section.classList.remove('is-open');
      section.querySelector('.group-header').setAttribute('aria-expanded', 'false');
      openGroups.delete(section.dataset.groupKey);
    });
    return;
  }
  // Group header toggle
  const groupHeader = e.target.closest('.group-header');
  if (groupHeader) {
    const section = groupHeader.closest('.group-section');
    section.classList.toggle('is-open');
    const isOpen = section.classList.contains('is-open');
    groupHeader.setAttribute('aria-expanded', String(isOpen));
    if (isOpen) openGroups.add(section.dataset.groupKey);
    else openGroups.delete(section.dataset.groupKey);
    return;
  }
  const summary = e.target.closest('.member-summary');
  if (summary) {
    const card = summary.closest('.member-card');
    card.classList.toggle('is-open');
    const isOpen = card.classList.contains('is-open');
    summary.setAttribute('aria-expanded', String(isOpen));
    const key = card.dataset.key;
    if (isOpen) openCards.add(key); else openCards.delete(key);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.target.matches('input, textarea, select')) {
    e.preventDefault(); document.getElementById('search').focus();
  }
  if (e.key === 'Escape') {
    const active = document.activeElement;
    if (active && active.id === 'search') {
      searchQuery = ''; active.value = ''; updateTabCounts(); render();
    }
  }
});

updateTabCounts();
render();
</script>
